AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudWatch APM Documentation - Authentication Infrastructure'

Parameters:
  Environment:
    Type: String
    Default: staging
    AllowedValues:
      - staging
      - production
    Description: Environment name
  
  SSOProviderArn:
    Type: String
    Description: AWS SSO Identity Provider ARN
    Default: ''
  
  SSOMetadataURL:
    Type: String
    Description: AWS SSO SAML Metadata URL
    Default: ''

Resources:
  # Cognito User Pool
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'cloudwatch-apm-docs-${Environment}'
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: given_name
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: family_name
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: department
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: employee_id
          AttributeDataType: String
          Required: false
          Mutable: true
      UserPoolTags:
        Project: CloudWatchAPMDocs
        Environment: !Ref Environment

  # Cognito User Pool Domain
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub 'cloudwatch-apm-docs-${Environment}-${AWS::AccountId}'
      UserPoolId: !Ref UserPool

  # SAML Identity Provider for AWS SSO
  SSOIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasSSOProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: AWSSSO
      ProviderType: SAML
      ProviderDetails:
        MetadataURL: !Ref SSOMetadataURL
      AttributeMapping:
        email: http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress
        given_name: http://schemas.xmlsoap.org/ws/2005/05/identity/claims/givenname
        family_name: http://schemas.xmlsoap.org/ws/2005/05/identity/claims/surname
        department: http://schemas.xmlsoap.org/ws/2005/05/identity/claims/department
        employee_id: http://schemas.xmlsoap.org/ws/2005/05/identity/claims/employeeid

  # User Pool Client for Web Application
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'cloudwatch-apm-docs-web-${Environment}'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      SupportedIdentityProviders:
        - COGNITO_USER_POOLS
        - !If [HasSSOProvider, !Ref SSOIdentityProvider, !Ref 'AWS::NoValue']
      CallbackURLs:
        - !Sub 'https://docs.cloudwatch-apm.aws.amazon.com/auth/callback'
        - !Sub 'http://localhost:3000/auth/callback'
      LogoutURLs:
        - !Sub 'https://docs.cloudwatch-apm.aws.amazon.com/auth/logout'
        - !Sub 'http://localhost:3000/auth/logout'
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      AllowedOAuthFlowsUserPoolClient: true
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30

  # Identity Pool for AWS resource access
  IdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Sub 'cloudwatch_apm_docs_${Environment}'
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
        - ClientId: !Ref UserPoolClient
          ProviderName: !GetAtt UserPool.ProviderName

  # IAM Roles for authenticated users
  AuthenticatedRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'CloudWatchAPMDocs-AuthenticatedRole-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'cognito-identity.amazonaws.com:aud': !Ref IdentityPool
              'ForAnyValue:StringLike':
                'cognito-identity.amazonaws.com:amr': authenticated
      Policies:
        - PolicyName: AuthenticatedUserPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-identity:GetCredentialsForIdentity
                  - cognito-identity:GetId
                Resource: '*'

  # IAM Role for Reviewers
  ReviewerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'CloudWatchAPMDocs-ReviewerRole-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'cognito-identity.amazonaws.com:aud': !Ref IdentityPool
              'ForAnyValue:StringLike':
                'cognito-identity.amazonaws.com:amr': authenticated
      Policies:
        - PolicyName: ReviewerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::cloudwatch-apm-docs-${Environment}-${AWS::AccountId}'
                  - !Sub 'arn:aws:s3:::cloudwatch-apm-docs-${Environment}-${AWS::AccountId}/*'

  # IAM Role for Editors
  EditorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'CloudWatchAPMDocs-EditorRole-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'cognito-identity.amazonaws.com:aud': !Ref IdentityPool
              'ForAnyValue:StringLike':
                'cognito-identity.amazonaws.com:amr': authenticated
      Policies:
        - PolicyName: EditorPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::cloudwatch-apm-docs-${Environment}-${AWS::AccountId}'
                  - !Sub 'arn:aws:s3:::cloudwatch-apm-docs-${Environment}-${AWS::AccountId}/*'

  # IAM Role for Admins
  AdminRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'CloudWatchAPMDocs-AdminRole-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'cognito-identity.amazonaws.com:aud': !Ref IdentityPool
              'ForAnyValue:StringLike':
                'cognito-identity.amazonaws.com:amr': authenticated
      Policies:
        - PolicyName: AdminPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:*
                  - cloudfront:CreateInvalidation
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminUpdateUserAttributes
                  - cognito-idp:ListUsers
                Resource: '*'

  # Identity Pool Role Attachment
  IdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref IdentityPool
      Roles:
        authenticated: !GetAtt AuthenticatedRole.Arn
      RoleMappings:
        UserPoolMapping:
          Type: Token
          AmbiguousRoleResolution: AuthenticatedRole
          IdentityProvider: !Sub '${UserPool}:${UserPoolClient}'

Conditions:
  HasSSOProvider: !Not [!Equals [!Ref SSOProviderArn, '']]

Outputs:
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolId'
  
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolClientId'
  
  IdentityPoolId:
    Description: Cognito Identity Pool ID
    Value: !Ref IdentityPool
    Export:
      Name: !Sub '${AWS::StackName}-IdentityPoolId'
  
  UserPoolDomain:
    Description: Cognito User Pool Domain
    Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolDomain'
  
  ReviewerRoleArn:
    Description: Reviewer Role ARN
    Value: !GetAtt ReviewerRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ReviewerRoleArn'
  
  EditorRoleArn:
    Description: Editor Role ARN
    Value: !GetAtt EditorRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-EditorRoleArn'
  
  AdminRoleArn:
    Description: Admin Role ARN
    Value: !GetAtt AdminRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-AdminRoleArn'